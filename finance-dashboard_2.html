<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayoub — Financial Board | لوحة المالية</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2130; --card2:#202a3d; --line:#2c3850;
    --txt:#e8edf5; --mut:#93a1b8;
    --green:#34c98e; --yellow:#f2b93b; --red:#f2634e; --blue:#5b9cf5;
    --greenbg:rgba(52,201,142,.12); --yellowbg:rgba(242,185,59,.12); --redbg:rgba(242,99,78,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:40px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  /* language toggle */
  .langbar{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 0}
  .langbar button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:14px}
  .langbar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  h1{font-size:24px;margin:10px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  /* status bar */
  .status{background:linear-gradient(135deg,#2a1e22,#1a2130);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
  .status h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{flex:1 1 220px;border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid var(--line)}
  .chip b{display:block;font-size:14px;margin-bottom:3px}
  .c-red{background:var(--redbg);border-color:var(--red)} .c-red b{color:var(--red)}
  .c-yellow{background:var(--yellowbg);border-color:var(--yellow)} .c-yellow b{color:var(--yellow)}
  .c-green{background:var(--greenbg);border-color:var(--green)} .c-green b{color:var(--green)}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
  /* KPI tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .tile .tl{font-size:22px;font-weight:700;margin-top:4px}
  .tile .usd{color:var(--blue);font-size:13px;margin-top:2px}
  /* sections */
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px}
  section h2{font-size:17px;margin-bottom:14px;border-inline-start:4px solid var(--blue);padding-inline-start:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num{font-variant-numeric:tabular-nums}
  .usd-c{color:var(--blue)}
  .pct{color:var(--mut)}
  .bar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;border-radius:4px}
  tr.total td{font-weight:700;border-top:2px solid var(--line)}
  .g{color:var(--green)} .y{color:var(--yellow)} .r{color:var(--red)}
  ul{padding-inline-start:20px}
  li{margin-bottom:10px;font-size:14px}
  li b{color:var(--txt)}
  .advice li::marker{color:var(--blue)}
  .steps li{list-style:none;position:relative;padding-inline-start:30px}
  .steps li::before{content:attr(data-n);position:absolute;inset-inline-start:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .note{font-size:12px;color:var(--mut);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  [dir="rtl"] body{font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="langbar">
  <button id="btn-en" class="active" onclick="setLang('en')">English</button>

</div>
<div class="wrap" id="content"></div>

    "ادفع لنفسك أولاً — الادخار فاتورة تدين بها لمستقبلك، وليس ما يتبقى.",
    "مع تضخم الليرة، احتفظ بصندوق الطوارئ في حساب مشاركة أو جزئياً بعملة صعبة/ذهب حتى لا تذوب قيمته.",
    "دخلك بالليرة لكنه مرتبط جزئياً بالدولار (RemotePass) — التفكير بالدولار، كما تفعل هذه اللوحة، يحميك من وهم المال عند تحرك الليرة.",
    "لا تُبقِ رصيداً دوّاراً على البطاقة الائتمانية في تركيا — الفوائد تجعله أغلى اقتراض ممكن.",
    "راجع هذه اللوحة شهرياً: إذا لم يكن 'المتبقي' 10% على الأقل من الدخل، فالشهر فشل مهما بدا شعورياً.",
    "التسريبات الصغيرة تُغرق السفن: 100 عملية شراء أقل من 100 ليرة كلّفتك 5,184 ليرة (108$) — غير مرئية فردياً، فاتورة خدمات مجتمعةً."]},
  note:{en:"Data source: bank statement 28 Apr – 17 Aug 2026 (400 transactions). USD figures use ₺47.90/USD. This is structured coaching, not licensed financial advice.",
        ar:"مصدر البيانات: كشف الحساب البنكي 28 أبريل – 17 أغسطس 2026 (400 عملية). الأرقام الدولارية بسعر 47.90 ليرة/دولار. هذا توجيه منظم وليس استشارة مالية مرخصة."}
};

function render(lang){
  const t = k => k[lang];
  let h = `<h1>${t(D.title)}</h1><div class="sub">${t(D.period)}</div>`;
  // status bar
  h += `<div class="status"><h2>${t(D.statusTitle)}</h2><div class="chips">`;
  D.chips.forEach(c=>{ const [b,txt]=c[lang]; h+=`<div class="chip ${c.c}"><b>${b}</b>${txt}</div>`; });
  h += `</div><div class="legend">`;
  D.legend[lang].forEach(([col,txt])=>h+=`<span><span class="dot" style="background:var(${col})"></span>${txt}</span>`);
  h += `</div></div>`;
  // tiles (percentage-first)
  h += `<div class="tiles">`;
  D.tiles.forEach(ti=>{
    h+=`<div class="tile"><div class="lbl">${ti.lbl[lang]}</div><div class="tl" style="color:${ti.col||'var(--txt)'}">${ti.pct}</div><div class="usd">${ti.sub[lang]}</div></div>`;
  });
  h += `</div>`;
  // table: now vs target %
  h += `<section><h2>${t(D.tblTitle)}</h2><table><tr>`;
  D.th[lang].forEach(x=>h+=`<th>${x}</th>`); h+=`</tr>`;
  let totN=0, totT=0;
  D.rows.forEach(r=>{
    totN+=r.p; totT+=r.t;
    const arrow = r.p>r.t ? `<span class="r">▼ ${(r.p-r.t).toFixed(1)}</span>` : (r.t>r.p ? `<span class="g">▲ ${(r.t-r.p).toFixed(1)}</span>` : `<span class="g">✓</span>`);
    h+=`<tr><td>${r[lang]}</td><td class="num" style="color:${r.c};font-weight:700">${r.p}%</td><td class="num pct">${r.t}% ${arrow}</td><td style="font-size:13px">${r.act[lang]}</td>
    <td style="min-width:120px"><div class="bar"><i style="width:${Math.min(r.p,100)}%;background:${r.c}"></i></div><div class="bar" style="margin-top:3px;opacity:.45"><i style="width:${Math.min(r.t,100)}%;background:var(--blue)"></i></div></td></tr>`;
  });
  h+=`<tr class="total"><td>${t(D.totalRow)}</td><td class="num">${totN.toFixed(0)}%</td><td class="num">${totT.toFixed(0)}%</td><td colspan="2" style="font-size:12px;color:var(--mut)">${lang==='en'?"Colored bar = now · blue bar = target. Current total >100% because spending also ate non-salary inflows.":"الشريط الملون = الآن · الأزرق = الهدف. الإجمالي الحالي فوق 100% لأن الإنفاق استهلك أيضاً الدخل غير الراتبي."}</td></tr>`;
  h+=`</table></section>`;
  // golden rule strip
  h += `<section style="background:linear-gradient(135deg,#16241f,#1a2130)"><h2 style="border-color:var(--green)">${lang==='en'?"🥇 The One Rule":"🥇 القاعدة الذهبية"}</h2><p style="font-size:15px">${lang==='en'?"<b>15% out on payday → 55% to live → 30% max for transfers & everything else.</b> If 'Saved' isn't 15% at month-end, the month failed — no matter how it felt.":"<b>15% تُحوَّل يوم الراتب → 55% للمعيشة → 30% كحد أقصى للتحويلات وكل شيء آخر.</b> إذا لم يكن المدّخر 15% نهاية الشهر، فالشهر فشل — مهما كان شعورك."}</p></section>`;
  // analysis
  h += `<section><h2>${t(D.anaTitle)}</h2><ul class="advice">`;
  D.analysis[lang].forEach(x=>h+=`<li>${x}</li>`); h+=`</ul></section>`;
  // steps
  h += `<section><h2>${t(D.stepTitle)}</h2><ul class="steps">`;
  D.steps[lang].forEach((x,i)=>h+=`<li data-n="${i+1}">${x}</li>`); h+=`</ul></section>`;
  // debt plan
  h += `<section><h2>${t(D.debtTitle)}</h2><p style="font-size:13px;color:var(--mut);margin-bottom:14px">${t(D.debtIntro)}</p><ul class="steps">`;
  D.debtSteps[lang].forEach((x,i)=>h+=`<li data-n="${i+1}">${x}</li>`); h+=`</ul></section>`;
  // general advice
  h += `<section><h2>${t(D.genTitle)}</h2><ul class="advice">`;
  D.general[lang].forEach(x=>h+=`<li>${x}</li>`); h+=`</ul>`;
  h += `<div class="note">${t(D.note)}</div></section>`;
  document.getElementById('content').innerHTML = h;
}
function setLang(l){
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-ar').classList.toggle('active', l==='ar');
  render(l);
}
render('en');
</script>
</body>
</html>
